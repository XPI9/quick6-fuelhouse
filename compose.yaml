# Quick6 FuelHouse — VPS compose (runs ALONGSIDE xpi-schedule & xpi-bd, never touches them)
# Binds ONLY to the Docker bridge (172.18.0.1) so Caddy can reach it but the public
# internet cannot (ufw allows only 22/80/443). Caddy reverse-proxies the subdomain to it.
#   quick6-fuelhouse -> 172.18.0.1:3300

name: quick6-fuelhouse

services:
  # Quick6 FuelHouse (Keith Ballard, red) -> fuel.xpisolutions.com
  fuelhouse:
    build: .
    container_name: quick6-fuelhouse
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3300"
      FUEL_BRAND: "quick6"
    dns:
      - "1.1.1.1"
      - "8.8.8.8"
    ports:
      - "172.18.0.1:3300:3300"

  # XPI Athlete Fuel (XPI, amber, for HS coaches) -> athletefuel.xpisolutions.com
  athletefuel:
    build: .
    container_name: xpi-athlete-fuel
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3301"
      FUEL_BRAND: "xpi"
    dns:
      - "1.1.1.1"
      - "8.8.8.8"
    ports:
      - "172.18.0.1:3301:3301"
    volumes:
      # Persist captured coach leads across rebuilds (leads.jsonl lives here).
      - ./data-xpi:/app/data
